<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset your SkillMatch password</title>
  </head>
  <body style="margin: 0; background: #f4f7f5; color: #1f2937; font-family: Arial, sans-serif;">
    <main style="max-width: 560px; margin: 0 auto; padding: 32px 20px;">
      <section style="background: #ffffff; border: 1px solid #dfe7e2; border-radius: 12px; padding: 28px;">
        <p style="margin: 0 0 12px; color: #176b45; font-size: 18px; font-weight: 700;">SkillMatch</p>
        <h1 style="margin: 0 0 16px; font-size: 24px; line-height: 1.3;">Reset your password</h1>
        <p style="margin: 0 0 20px; line-height: 1.6;">Use the button below to continue to SkillMatch and choose a new password.</p>
        <p style="margin: 0 0 20px;">
          <a href="{{ .ConfirmationURL }}" style="display: inline-block; border-radius: 8px; background: #176b45; color: #ffffff; font-weight: 700; padding: 12px 20px; text-decoration: none;">Reset password</a>
        </p>
        <p style="margin: 0; color: #4b5563; line-height: 1.6;">If you did not request a password reset, ignore this email and your password will remain unchanged.</p>
      </section>
    </main>
  </body>
</html>

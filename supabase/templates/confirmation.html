<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Confirm your SkillMatch account</title>
  </head>
  <body style="margin: 0; background: #f4f7f5; color: #1f2937; font-family: Arial, sans-serif;">
    <main style="max-width: 560px; margin: 0 auto; padding: 32px 20px;">
      <section style="background: #ffffff; border: 1px solid #dfe7e2; border-radius: 12px; padding: 28px;">
        <p style="margin: 0 0 12px; color: #176b45; font-size: 18px; font-weight: 700;">SkillMatch</p>
        <h1 style="margin: 0 0 16px; font-size: 24px; line-height: 1.3;">Confirm your account</h1>
        <p style="margin: 0 0 20px; line-height: 1.6;">Enter this six-digit code in the SkillMatch app to finish signing up:</p>
        <p aria-label="Confirmation code" style="margin: 0 0 20px; padding: 16px; border-radius: 8px; background: #edf7f1; color: #124c34; font-family: Consolas, monospace; font-size: 30px; font-weight: 700; letter-spacing: 6px; text-align: center;">{{ .Token }}</p>
        <p style="margin: 0 0 12px; line-height: 1.6;">This code expires in one hour. Do not share it with anyone.</p>
        <p style="margin: 0; color: #4b5563; line-height: 1.6;">If you did not create a SkillMatch account, you can ignore this email.</p>
      </section>
    </main>
  </body>
</html>
